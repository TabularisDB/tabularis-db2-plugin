name: Release

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: tabularis-db2-plugin

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest and EXPLAIN parser versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TABULARIUM_VERSION=$(jq -r .version .tabularium)
          EXPLAIN_VERSION=$(jq -r .version explain/package.json)

          if [ "$TAG_VERSION" != "$TABULARIUM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match .tabularium version ($TABULARIUM_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$EXPLAIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match explain/package.json version ($EXPLAIN_VERSION)"
            exit 1
          fi

      - name: Check CHANGELOG.md has a section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION]' heading). Add one before tagging."
            exit 1
          fi

  # The Visual EXPLAIN parser is plain JavaScript, the same on every
  # platform: built and tested once, then packed into every archive.
  explain:
    name: EXPLAIN parser
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm comes from the "packageManager" field of explain/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: explain/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # tsup 9 requires Node 22.18 or newer on the Node 22 line.
          node-version: "22.18"

      - name: Typecheck, test and build
        working-directory: explain
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Stash bundle
        uses: actions/upload-artifact@v7
        with:
          name: explain-parser
          path: explain/dist/index.iife.js
          retention-days: 1

  build:
    name: ${{ matrix.platform-label }}
    needs: [validate, explain]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-suffix: ""
          # Native arm64 runner rather than `cross`: the binary links against
          # the ODBC driver manager, which a cross container would have to
          # provide for the target architecture.
          - platform-label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary-suffix: ""
          # Built natively on an Intel runner: Homebrew's installer refuses
          # x86_64 under Rosetta on Apple Silicon, so the unixODBC an Intel
          # build links against can no longer be installed there.
          - platform-label: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary-suffix: ""
          - platform-label: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary-suffix: ""
          - platform-label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary-suffix: ".exe"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ODBC build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev zip

      - name: Install ODBC build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install unixodbc

      - name: Build
        env:
          LIBRARY_PATH: ${{ matrix.target == 'x86_64-apple-darwin' && '/usr/local/lib' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      # `.tabularium` declares the bundle at explain/dist/index.iife.js,
      # relative to the installed plugin directory.
      - name: Download EXPLAIN parser
        uses: actions/download-artifact@v8
        with:
          name: explain-parser
          path: staging/explain/dist

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          STAGE=staging
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.binary-suffix }} "$STAGE/"
          cp .tabularium "$STAGE/"
          test -f "$STAGE/explain/dist/index.iife.js"
          (cd "$STAGE" && zip -r ../db2-plugin-${{ matrix.platform-label }}.zip .)

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}${{ matrix.binary-suffix }}" $stage
          Copy-Item ".tabularium" $stage
          if (-not (Test-Path "$stage\explain\dist\index.iife.js")) {
            Write-Error "EXPLAIN parser bundle missing from the archive"
            exit 1
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "db2-plugin-${{ matrix.platform-label }}.zip"

      # `initialize` needs no Db2 server or ODBC driver, only the ODBC driver
      # manager the binary links against, which is installed on every runner
      # above (and ships with Windows).
      - name: Smoke test binary (unix)
        if: runner.os != 'Windows'
        run: |
          response=$(echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | ./staging/${{ env.BINARY_NAME }}${{ matrix.binary-suffix }})
          echo "$response"
          echo "$response" | jq -e 'has("error") | not' > /dev/null || {
            echo "::error::Binary did not return a valid initialize response"
            exit 1
          }

      - name: Smoke test binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $response = '{"jsonrpc":"2.0","method":"initialize","id":1}' | & ".\staging\${{ env.BINARY_NAME }}${{ matrix.binary-suffix }}"
          Write-Output $response
          $parsed = $response | ConvertFrom-Json
          if ($null -ne $parsed.error) {
            Write-Error "Binary did not return a valid initialize response"
            exit 1
          }

      - name: Stash artifact
        uses: actions/upload-artifact@v7
        with:
          name: db2-plugin-${{ matrix.platform-label }}
          path: db2-plugin-${{ matrix.platform-label }}.zip
          retention-days: 1

  publish-explain:
    name: Publish EXPLAIN parser to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: explain/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          registry-url: "https://registry.npmjs.org"
      - name: Check whether this version is already published
        id: npm
        working-directory: explain
        run: |
          if npm view "$(jq -r .name package.json)@$(jq -r .version package.json)" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and build
        if: steps.npm.outputs.published == 'false'
        working-directory: explain
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Configure npm Trusted Publishing for this repository and release.yml.
      - name: Publish
        if: steps.npm.outputs.published == 'false'
        working-directory: explain
        run: pnpm publish --access public --provenance --no-git-checks

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for the .tabularium manifest asset)
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Detect prerelease from tag
        id: meta
        run: |
          # Auto-flag prerelease when the tag has a "-" suffix (semver
          # pre-release, e.g. v1.0.0-beta.1) — matches tabularis's own
          # release.yml convention.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Pull this version's section out of CHANGELOG.md so the GitHub
          # release body is the same hand-written prose we already maintain.
          # A version's section runs from its "## [x.y.z]" heading to the
          # next one (or EOF for the oldest entry).
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            /^## \[/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*/, "", line)
              if (capturing) { exit }
              if (line == ver) { capturing = 1; found = 1; next }
              next
            }
            capturing { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/release-notes.raw.md || {
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION]' heading). Add one before tagging."
            exit 1
          }

          # Trim leading/trailing blank lines the section boundary leaves
          # behind, without collapsing intentional blank lines between bullets.
          awk 'NF{p=1} p' /tmp/release-notes.raw.md | tac | awk 'NF{p=1} p' | tac > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md section for version $VERSION is empty."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # .tabularium ships as a standalone asset: the registry resolves the
          # manifest from release assets, not the git ref.
          files: |
            artifacts/*.zip
            .tabularium
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
