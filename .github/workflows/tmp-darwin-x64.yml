# Temporary: checks the darwin-x64 release build on this PR. Removed before merge.
name: darwin-x64 build check
on:
  pull_request:
    branches: [master]
jobs:
  darwin-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: brew install unixodbc
      - name: Build
        env:
          LIBRARY_PATH: /usr/local/lib
        run: cargo build --release --target x86_64-apple-darwin
      - name: Inspect and smoke test
        run: |
          B=target/x86_64-apple-darwin/release/tabularis-db2-plugin
          file "$B"
          otool -L "$B"
          echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | "$B"
