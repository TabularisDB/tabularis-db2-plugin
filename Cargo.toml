[package]
name = "tabularis-db2-plugin"
version = "0.1.1"
edition = "2021"
description = "IBM Db2 plugin driver for Tabularis"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tabularis-db2-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"

[dependencies]
base64 = "0.23.1"
infer = "0.22"
odbc-api = "29"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
